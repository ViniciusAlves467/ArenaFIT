# Configuração do Supabase CLI.
# - Desenvolvimento local: `npx supabase start`.
# - Projeto na nuvem: `npx supabase config push` envia a seção [auth] (URLs e Google).
#   Antes, exporte as variáveis usadas em env(...) — veja docs/AUTH.md.
project_id = "xainescjcawmvarsjumc"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
# Login apenas com Google: nenhum e-mail é enviado, então não há SMTP nem templates.
# Para onde o OAuth volta. O app envia o redirect exato em cada chamada; aqui ficam os
# permitidos: APK (arenafit://), Expo Go (exp://…/--/auth-callback) e web local.
site_url = "arenafit://auth-callback"
additional_redirect_urls = ["arenafit://auth-callback", "exp://**", "http://localhost:8081/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Permite criar a conta no primeiro login com Google.
enable_signup = true

[auth.email]
# Cadastro e login por e-mail/senha desativados (sem custo de SMTP).
enable_signup = false

# Login com Google: credencial OAuth "Aplicativo da Web" no Google Cloud (passo a passo em docs/AUTH.md).
[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
skip_nonce_check = false

[functions.submit-checkin]
verify_jwt = true

[functions.delete-account]
verify_jwt = true
